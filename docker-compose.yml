services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meudireito
      POSTGRES_PASSWORD: meudireito_local
      POSTGRES_DB: meudireito
    ports:
      - "5434:5432"
    volumes:
      - meudireito_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meudireito -d meudireito"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meudireito_pg:
